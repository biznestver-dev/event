<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Meta Tags для iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AM Prod">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/7325/7325295.png">
    
    <!-- Подключение манифеста -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    
    <title>AM Prod Calendar</title>
    
    <!-- Библиотеки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Стили -->
    <style>
        .ios-header {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding-top: max(3rem, env(safe-area-inset-top));
        }

        .hidden-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hidden-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .date-icon {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .date-icon:active {
            transform: scale(0.95);
        }

        .date-icon.active {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(59, 130, 246, 0.5);
        }
        
        .modal-active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        
        .modal-active > div {
            transform: scale(1) !important;
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased pb-24 selection:bg-blue-500/30">

    <!-- Header -->
    <header class="ios-header fixed top-0 w-full z-40 px-4 pt-12 pb-3 border-b border-white/10 flex justify-between items-center max-w-md mx-auto left-0 right-0">
        <h1 class="text-xl font-semibold tracking-tight">Проекты AM</h1>
        <div class="flex gap-3">
            <label class="bg-gray-800 hover:bg-gray-700 text-white p-2 rounded-full cursor-pointer transition-colors shadow-lg active:scale-95">
                <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
                <input type="file" id="excel-upload" class="hidden" accept=".xlsx, .xls">
            </label>
            <button id="add-btn" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-full transition-colors shadow-[0_0_15px_rgba(59,130,246,0.5)] active:scale-95">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-24 h-screen overflow-y-auto hidden-scrollbar max-w-md mx-auto relative">
        
        <div class="px-4 mb-4">
            <div class="bg-gray-900/60 border border-white/5 p-4 rounded-3xl shadow-sm backdrop-blur-md grid grid-cols-3 gap-2 text-center divide-x divide-white/10">
                <div>
                    <div class="text-[9px] text-gray-500 uppercase font-bold tracking-wider mb-1">Всего</div>
                    <div class="text-sm font-bold text-white" id="global-total">0 ₽</div>
                </div>
                <div>
                    <div class="text-[9px] text-gray-500 uppercase font-bold tracking-wider mb-1">Оплачено</div>
                    <div class="text-sm font-bold text-green-400" id="global-paid">0 ₽</div>
                </div>
                <div>
                    <div class="text-[9px] text-gray-500 uppercase font-bold tracking-wider mb-1">Ожидается</div>
                    <div class="text-sm font-bold text-yellow-400" id="global-pending">0 ₽</div>
                </div>
            </div>
        </div>

        <!-- Timeline -->
        <div class="px-4 pb-2">
            <div id="timeline" class="flex gap-4 overflow-x-auto hidden-scrollbar pb-4 pt-2 snap-x">
                <!-- Date icons will be injected here -->
            </div>
        </div>

        <!-- Dynamic Date Content -->
        <div id="date-content" class="px-4 mt-2 hidden">
            <!-- Project & Date Card -->
            <div class="bg-gray-900/60 border border-white/5 p-5 rounded-3xl mb-4 shadow-sm backdrop-blur-md">
                <div class="flex justify-between items-start mb-3">
                    <h2 id="project-name" class="text-lg font-bold leading-tight">Название проекта</h2>
                    <div class="flex items-center gap-1.5 text-xs font-medium text-gray-400 bg-gray-800/80 px-2.5 py-1 rounded-lg border border-white/5 shrink-0">
                        <i data-lucide="cloud-sun" class="w-3.5 h-3.5"></i>
                        <span>+22°</span>
                    </div>
                </div>
                <div class="flex items-center gap-2 text-gray-400 text-sm">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span id="project-date">Дата</span>
                </div>
            </div>

            <!-- Finance Block -->
            <div id="finance-block" class="bg-gray-900/60 border border-white/5 p-5 rounded-3xl mb-6 shadow-sm backdrop-blur-md">
                <!-- Injected via JS -->
            </div>

            <div class="border-t border-white/10 pt-6">
                <h3 class="text-sm font-semibold text-gray-400 mb-4 uppercase tracking-wider px-1">Списки на площадку</h3>
                <div id="excel-data-container" class="space-y-3 pb-8">
                    <div id="excel-empty-state" class="bg-gray-900/30 border border-dashed border-white/10 rounded-3xl p-8 text-center">
                        <div class="bg-gray-800/50 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="list-x" class="w-6 h-6 text-gray-500"></i>
                        </div>
                        <p class="text-sm text-gray-500">Загрузите таблицу со списком (кнопка в правом верхнем углу).</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Empty Timeline State -->
        <div id="empty-state" class="hidden px-4 mt-6 text-center text-gray-500 text-sm">
            Нет добавленных дат. Нажмите + чтобы создать проект.
        </div>
    </main>

    <!-- Add Date Modal -->
    <div id="modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-[2rem] w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold mb-5 text-white">Новый проект</h3>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1">Название проекта</label>
                    <input type="text" id="input-name" placeholder="Например: Электротеатр" class="w-full bg-gray-800 text-white text-sm rounded-xl py-3 px-4 outline-none border border-gray-700 focus:border-blue-500 transition-colors">
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1">Дата</label>
                    <input type="date" id="input-date" class="w-full bg-gray-800 text-white text-sm rounded-xl py-3 px-4 outline-none border border-gray-700 focus:border-blue-500 transition-colors block" style="color-scheme: dark;">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1">Кол-во человек</label>
                        <input type="number" id="input-people" placeholder="0" class="w-full bg-gray-800 text-white text-sm rounded-xl py-3 px-4 outline-none border border-gray-700 focus:border-blue-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1">Ставка (₽)</label>
                        <input type="number" id="input-rate" placeholder="0" class="w-full bg-gray-800 text-white text-sm rounded-xl py-3 px-4 outline-none border border-gray-700 focus:border-blue-500 transition-colors">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1">Общий Гонорар (₽)</label>
                        <input type="number" id="input-cost" placeholder="0" class="w-full bg-gray-800 text-white text-sm rounded-xl py-3 px-4 outline-none border border-gray-700 focus:border-blue-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1">Способ оплаты</label>
                        <select id="input-method" class="w-full bg-gray-800 text-white text-sm rounded-xl py-3 px-4 outline-none border border-gray-700 focus:border-blue-500 transition-colors appearance-none">
                            <option value="На карту">На карту</option>
                            <option value="Наличные">Наличные</option>
                            <option value="Безнал (ИП)">Безнал (ИП)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button id="btn-cancel" class="flex-1 py-3.5 rounded-xl bg-gray-800 text-gray-300 font-medium active:scale-95 transition-transform">Отмена</button>
                <button id="btn-save" class="flex-1 py-3.5 rounded-xl bg-blue-600 text-white font-medium active:scale-95 transition-transform shadow-lg shadow-blue-600/20">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        let projects = [];
        let activeProjectId = null;

        const DOM = {
            timeline: document.getElementById('timeline'),
            content: document.getElementById('date-content'),
            emptyState: document.getElementById('empty-state'),
            projectName: document.getElementById('project-name'),
            projectDate: document.getElementById('project-date'),
            financeBlock: document.getElementById('finance-block'),
            modal: document.getElementById('modal'),
            addBtn: document.getElementById('add-btn'),
            cancelBtn: document.getElementById('btn-cancel'),
            saveBtn: document.getElementById('btn-save'),
            inpName: document.getElementById('input-name'),
            inpDate: document.getElementById('input-date'),
            inpPeople: document.getElementById('input-people'),
            inpRate: document.getElementById('input-rate'),
            inpCost: document.getElementById('input-cost'),
            inpMethod: document.getElementById('input-method'),
            excelInput: document.getElementById('excel-upload'),
            excelContainer: document.getElementById('excel-data-container'),
            excelEmptyState: document.getElementById('excel-empty-state'),
            // Global finance DOM
            gTotal: document.getElementById('global-total'),
            gPaid: document.getElementById('global-paid'),
            gPending: document.getElementById('global-pending')
        };

        const formatMoney = (amount) => Number(amount || 0).toLocaleString('ru-RU') + ' ₽';
        const getShortMonth = (date) => new Intl.DateTimeFormat('ru-RU', { month: 'short' }).format(date).replace('.', '');
        const getFullDate = (date) => new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);

        // Auto-calculate cost when people or rate changes
        function autoCalculateTotal() {
            const p = parseInt(DOM.inpPeople.value) || 0;
            const r = parseInt(DOM.inpRate.value) || 0;
            if (p > 0 && r > 0) {
                DOM.inpCost.value = p * r;
            }
        }
        DOM.inpPeople.addEventListener('input', autoCalculateTotal);
        DOM.inpRate.addEventListener('input', autoCalculateTotal);

        // Update Global Finance Dashboard
        function updateGlobalFinances() {
            let total = 0, paid = 0, pending = 0;
            projects.forEach(p => {
                total += p.cost;
                if (p.isPaid) {
                    paid += p.cost;
                } else {
                    pending += p.cost;
                }
            });
            DOM.gTotal.textContent = formatMoney(total);
            DOM.gPaid.textContent = formatMoney(paid);
            DOM.gPending.textContent = formatMoney(pending);
        }

        function renderTimeline() {
            DOM.timeline.innerHTML = '';
            
            if (projects.length === 0) {
                DOM.emptyState.classList.remove('hidden');
                DOM.content.classList.add('hidden');
                updateGlobalFinances();
                return;
            }

            DOM.emptyState.classList.add('hidden');
            DOM.content.classList.remove('hidden');

            projects.sort((a, b) => a.rawDate - b.rawDate);

            projects.forEach(proj => {
                const isActive = proj.id === activeProjectId;
                const btn = document.createElement('button');
                
                let baseClasses = 'date-icon snap-center shrink-0 w-[4.5rem] h-[4.5rem] rounded-2xl flex flex-col items-center justify-center border outline-none ';
                
                // Add green border indicator if paid and not active
                const borderStyle = proj.isPaid && !isActive ? 'border-green-500/50' : 'border-white/10';

                if (isActive) {
                    btn.className = baseClasses + 'bg-gradient-to-b from-blue-500 to-blue-600 border-blue-400 text-white shadow-lg shadow-blue-500/20';
                } else {
                    btn.className = baseClasses + `bg-gray-800/80 backdrop-blur-md ${borderStyle} text-gray-400`;
                }
                
                btn.innerHTML = `
                    <span class="text-[11px] uppercase font-semibold ${isActive ? 'text-blue-100' : 'opacity-50'} mb-0.5 tracking-wider">
                        ${getShortMonth(proj.rawDate)}
                    </span>
                    <span class="text-2xl font-bold leading-none ${isActive ? 'text-white' : 'text-gray-200'}">
                        ${proj.rawDate.getDate()}
                    </span>
                `;

                btn.onclick = () => {
                    activeProjectId = proj.id;
                    renderTimeline();
                    renderContent();
                };

                DOM.timeline.appendChild(btn);
            });
            
            updateGlobalFinances();
        }

        function renderContent() {
            const proj = projects.find(p => p.id === activeProjectId);
            if (!proj) return;

            DOM.projectName.textContent = proj.name;
            DOM.projectDate.textContent = getFullDate(proj.rawDate);

            if(proj.cost > 0) {
                DOM.financeBlock.classList.remove('hidden');
                const costColorClass = proj.isPaid ? 'text-green-400' : 'text-white';
                
                let actionHtml = '';
                if (proj.isPaid) {
                    actionHtml = `
                        <div class="mt-5 bg-green-500/10 border border-green-500/20 py-3 rounded-xl flex items-center justify-center gap-2 text-green-400 font-semibold text-sm transition-all">
                            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                            Оплачено
                        </div>
                    `;
                } else {
                    actionHtml = `
                        <button onclick="markAsPaid('${proj.id}')" class="mt-5 w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl flex items-center justify-center gap-2 text-white font-semibold text-sm transition-all active:scale-95 shadow-lg shadow-blue-600/20">
                            <i data-lucide="wallet" class="w-5 h-5"></i>
                            Оплатили
                        </button>
                    `;
                }

                // Show calculation breakdown if people/rate exist
                let calculationSubtext = '';
                if (proj.people > 0 && proj.rate > 0) {
                    calculationSubtext = `<div class="text-xs text-gray-400 mt-1">${proj.people} чел. × ${formatMoney(proj.rate)}</div>`;
                }

                DOM.financeBlock.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs text-gray-500 font-medium uppercase tracking-wider block mb-1">Гонорар</span>
                            <span class="text-2xl font-bold ${costColorClass} transition-colors">${formatMoney(proj.cost)}</span>
                            ${calculationSubtext}
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-gray-500 font-medium uppercase tracking-wider block mb-1">Способ</span>
                            <span class="text-sm font-medium text-gray-300 bg-gray-800/50 px-2 py-1 rounded-md">${proj.method}</span>
                        </div>
                    </div>
                    ${actionHtml}
                `;
            } else {
                DOM.financeBlock.classList.add('hidden');
                DOM.financeBlock.innerHTML = '';
            }
            
            lucide.createIcons();
        }

        window.markAsPaid = function(id) {
            const proj = projects.find(p => p.id === id);
            if (proj) {
                proj.isPaid = true;
                renderContent(); 
                renderTimeline(); // Re-render to update global finances and timeline borders
            }
        };

        const openModal = () => DOM.modal.classList.add('modal-active');
        const closeModal = () => {
            DOM.modal.classList.remove('modal-active');
            DOM.inpName.value = '';
            DOM.inpDate.value = '';
            DOM.inpPeople.value = '';
            DOM.inpRate.value = '';
            DOM.inpCost.value = '';
            DOM.inpMethod.value = 'На карту';
        };

        DOM.addBtn.addEventListener('click', openModal);
        DOM.cancelBtn.addEventListener('click', closeModal);
        
        DOM.modal.addEventListener('click', (e) => {
            if (e.target === DOM.modal) closeModal();
        });

        DOM.saveBtn.addEventListener('click', () => {
            const name = DOM.inpName.value.trim();
            const dateStr = DOM.inpDate.value;
            const people = parseInt(DOM.inpPeople.value) || 0;
            const rate = parseInt(DOM.inpRate.value) || 0;
            const cost = parseInt(DOM.inpCost.value) || 0;
            const method = DOM.inpMethod.value;

            if (!name || !dateStr) return; // Silent validation

            const newProj = {
                id: dateStr + '-' + Date.now(), 
                name: name,
                rawDate: new Date(dateStr),
                people: people,
                rate: rate,
                cost: cost,
                method: method,
                isPaid: false
            };

            projects.push(newProj);
            activeProjectId = newProj.id;
            
            renderTimeline();
            renderContent();
            closeModal();
        });

        DOM.excelInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                DOM.excelContainer.innerHTML = ''; 
                
                const headers = json[0];
                let hasData = false;
                
                for (let i = 1; i < json.length; i++) {
                    const row = json[i];
                    if (!row || row.length === 0) continue;

                    let cardHtml = `<div class="bg-gray-900/60 backdrop-blur-md p-4 rounded-2xl border border-white/5 shadow-sm mb-3">`;
                    let hasCell = false;
                    row.forEach((cell, index) => {
                        const headerName = headers[index] || `Колонка ${index + 1}`;
                        if (cell !== undefined && cell !== null && cell !== '') {
                            hasCell = true;
                            hasData = true;
                            cardHtml += `
                                <div class="mb-2 last:mb-0 flex justify-between gap-4 border-b border-white/5 pb-2 last:border-0 last:pb-0">
                                    <span class="text-xs text-gray-500 font-medium">${headerName}</span>
                                    <span class="text-sm text-gray-200 text-right break-words max-w-[60%]">${cell}</span>
                                </div>
                            `;
                        }
                    });
                    cardHtml += `</div>`;
                    if(hasCell) DOM.excelContainer.innerHTML += cardHtml;
                }
                
                if(!hasData) {
                    DOM.excelContainer.innerHTML = DOM.excelEmptyState.outerHTML;
                }
            };
            reader.readAsArrayBuffer(file);
            e.target.value = '';
        });

        // Initialize Icons & UI
        lucide.createIcons();
        renderTimeline();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('ServiceWorker registered:', registration.scope))
                    .catch(error => console.log('ServiceWorker error:', error));
            });
        }
    </script>
</body>
</html>
