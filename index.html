<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Event Kremlin">
    <link rel="apple-touch-icon" href="./icon.jpg">
    <link rel="manifest" href="manifest.json">
    
    <title>Event Production Kremlin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        .hidden-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-active { opacity: 1 !important; }
        .modal-active > #date-modal-content { transform: scale(1) !important; }
        
        /* Анимация заголовка */
        @keyframes shimmer-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-title {
            background-size: 200% 200%;
            animation: shimmer-bg 4s ease infinite;
        }

        /* Анимации иконок проектов */
        .date-icon {
            aspect-ratio: 1 / 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .date-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(59,130,246, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(59,130,246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59,130,246, 0); }
        }
        .date-icon.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 200% 200%;
            animation: shimmer-bg 3s ease infinite, pulse-border 2s infinite;
            border: none;
            transform: scale(1.05);
            z-index: 10;
        }
        
        .date-icon:active { transform: scale(0.9); }

        /* Анимации погоды */
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes rain-drop { 0% { transform: translateY(-2px); opacity: 0.8; } 100% { transform: translateY(5px); opacity: 0; } }
        
        .weather-spin { display: inline-block; animation: spin-slow 10s linear infinite; }
        .weather-float { display: inline-block; animation: float 3s ease-in-out infinite; }
        .weather-rain { display: inline-block; animation: rain-drop 1.5s linear infinite; }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased pb-24 overflow-x-hidden selection:bg-blue-500/30">

    <!-- Заголовок -->
    <div class="pt-14 pb-6 px-4 text-center">
        <h1 class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-blue-400 animated-title">
            Event Production Kremlin
        </h1>
    </div>

    <!-- Дашборд -->
    <div class="px-4 grid grid-cols-3 gap-3 mb-6">
        <div class="bg-green-900/20 p-3 rounded-2xl border border-green-500/30 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(34,197,94,0.1)]">
            <div class="text-[10px] text-green-500/90 uppercase tracking-wider mb-1 font-semibold">Оплачено</div>
            <div class="text-sm font-bold text-green-400" id="dash-paid">0 ₽</div>
        </div>
        <div class="bg-yellow-900/20 p-3 rounded-2xl border border-yellow-500/30 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(234,179,8,0.1)]">
            <div class="text-[10px] text-yellow-500/90 uppercase tracking-wider mb-1 font-semibold">Остаток</div>
            <div class="text-sm font-bold text-yellow-400" id="dash-pending">0 ₽</div>
        </div>
        <div class="bg-blue-900/20 p-3 rounded-2xl border border-blue-500/30 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.1)]">
            <div class="text-[10px] text-blue-400/90 uppercase tracking-wider mb-1 font-semibold">Всего</div>
            <div class="text-sm font-bold text-blue-400" id="dash-total">0 ₽</div>
        </div>
    </div>

    <!-- Кнопки управления -->
    <div class="px-4 flex gap-3 mb-8">
        <label class="flex-1 bg-gray-800/80 hover:bg-gray-700 backdrop-blur-md text-white py-3.5 px-2 rounded-2xl cursor-pointer transition-colors border border-white/10 flex items-center justify-center gap-2 relative overflow-hidden">
            <i data-lucide="file-spreadsheet" class="w-5 h-5 text-green-400"></i>
            <span class="text-xs font-bold uppercase tracking-wider">Загрузить Excel</span>
            <input type="file" id="excel-upload" class="hidden" accept=".xlsx, .xls">
        </label>
        
        <button id="add-date-btn" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3.5 px-2 rounded-2xl transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] border border-blue-400/30 flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span class="text-xs font-bold uppercase tracking-wider">Добавить</span>
        </button>
    </div>

    <!-- Сетка проектов -->
    <div class="px-4 mb-8">
        <div id="projects-timeline" class="grid grid-cols-4 gap-3">
            <!-- JS вставит проекты -->
        </div>
    </div>

    <!-- Детальная карточка проекта -->
    <div id="project-content" class="px-4 hidden opacity-0 transition-opacity duration-500 scroll-mt-6">
        <div class="bg-gray-900/40 backdrop-blur-xl border border-white/10 rounded-3xl p-5 shadow-2xl relative">
            
            <div class="mb-5 border-b border-white/5 pb-4 relative">
                <h2 id="project-title-label" class="text-2xl font-bold mb-3 text-white leading-tight">Название проекта</h2>
                
                <!-- Контейнер для дат и погоды -->
                <div id="project-dates-container" class="flex flex-col gap-2">
                    <!-- JS вставит дни проекта -->
                </div>
            </div>

            <!-- Управление -->
            <div class="flex gap-2 mb-6">
                <button id="edit-project-btn" class="flex-1 bg-gray-800/80 text-gray-300 py-3 rounded-xl text-xs font-bold uppercase tracking-wide flex justify-center items-center gap-2 border border-white/5 active:scale-95 transition-transform">
                    <i data-lucide="edit" class="w-4 h-4"></i> Изменить
                </button>
                <button id="share-project-btn" class="flex-1 bg-blue-900/30 text-blue-400 py-3 rounded-xl text-xs font-bold uppercase tracking-wide flex justify-center items-center gap-2 border border-blue-500/20 active:scale-95 transition-transform">
                    <i data-lucide="send" class="w-4 h-4"></i> Отправить
                </button>
                <button id="delete-project-btn" class="flex-1 bg-red-900/20 text-red-400 py-3 rounded-xl text-xs font-bold uppercase tracking-wide flex justify-center items-center gap-2 border border-red-500/20 active:scale-95 transition-transform">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Удалить
                </button>
            </div>

            <!-- Финансы -->
            <div id="finance-block" class="bg-black/20 border border-white/5 p-4 rounded-2xl mb-6 hidden">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Смета</div>
                        <div id="project-cost-label" class="text-2xl font-bold text-white">0 ₽</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Способ оплаты</div>
                        <div id="project-method-label" class="text-sm text-gray-300 font-medium">Наличные</div>
                    </div>
                </div>
                
                <div id="payment-actions">
                    <button id="mark-paid-btn" class="w-full bg-gradient-to-r from-blue-600/20 to-purple-600/20 text-blue-400 hover:from-blue-600/30 hover:to-purple-600/30 font-bold py-3 rounded-xl transition-colors border border-blue-500/30 flex justify-center items-center gap-2">
                        <i data-lucide="circle-dollar-sign" class="w-5 h-5"></i> Отметить как оплаченное
                    </button>
                    <div id="paid-status" class="hidden w-full bg-green-500/10 text-green-400 font-bold py-3 rounded-xl border border-green-500/20 flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(34,197,94,0.1)]">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i> Оплачено
                    </div>
                </div>
            </div>

            <!-- Excel списки -->
            <div class="flex justify-between items-center mb-4 mt-2">
                <h3 class="text-lg font-bold">Списки на площадку</h3>
            </div>
            <div id="excel-data-container" class="space-y-3 pb-2">
                <div class="text-center text-gray-600 mt-4 text-sm border border-dashed border-gray-700/50 rounded-2xl p-6 bg-gray-900/20" id="excel-empty-state">
                    <i data-lucide="list-x" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
                    Таблицы не загружены
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно (Новый проект) -->
    <div id="date-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-[2rem] w-full max-w-[360px] shadow-2xl transform scale-95 transition-transform duration-300 relative max-h-[90vh] overflow-y-auto hidden-scrollbar" id="date-modal-content">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-purple-500"></div>
            
            <h3 id="modal-title" class="text-lg font-bold mb-4 text-center mt-2">Новый проект</h3>
            
            <div class="space-y-4 mb-6">
                <!-- Название -->
                <input type="text" id="new-project-title" placeholder="Название (например, ВДНХ)" class="w-full bg-gray-950 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
                
                <!-- Блок Дат -->
                <div class="bg-gray-800/30 p-3 rounded-xl border border-gray-700/50">
                    <div class="text-[10px] text-gray-400 font-bold uppercase mb-2 ml-1">График работы (Даты и Тайминг)</div>
                    <div id="dynamic-dates-list" class="space-y-2 mb-3">
                        <!-- Сюда добавляются строки дат -->
                    </div>
                    <button type="button" id="add-dynamic-date-btn" class="w-full bg-gray-800/80 hover:bg-gray-700 text-blue-400 text-[11px] font-bold uppercase py-2.5 rounded-lg border border-gray-700 transition-colors flex justify-center items-center gap-1">
                        <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i> Добавить день
                    </button>
                </div>

                <!-- Калькулятор: Люди * Ставка -->
                <div class="flex gap-2">
                    <input type="number" id="calc-people" placeholder="Кол-во чел." class="w-1/2 bg-gray-950 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 focus:border-blue-500">
                    <input type="number" id="calc-rate" placeholder="Ставка, ₽" class="w-1/2 bg-gray-950 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 focus:border-blue-500">
                </div>

                <!-- Сумма и Оплата -->
                <div class="relative">
                    <span class="absolute left-4 top-3 text-gray-500 font-medium">₽</span>
                    <input type="number" id="new-project-cost" placeholder="Итоговая смета" class="w-full bg-gray-950 text-white text-sm rounded-xl py-3 pl-9 pr-4 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
                </div>
                <input type="text" id="new-project-method" placeholder="Способ оплаты (нал, карта, ИП)" class="w-full bg-gray-950 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
            </div>

            <div class="flex gap-3">
                <button id="cancel-date" class="flex-1 py-3 rounded-xl bg-gray-800 text-gray-300 font-bold uppercase tracking-wide text-xs active:scale-95 transition-transform">Отмена</button>
                <button id="save-date" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold uppercase tracking-wide text-xs active:scale-95 transition-transform shadow-lg shadow-blue-500/30">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            let activeProjects = [];
            let selectedProjectId = null;
            let isEditMode = false;

            // Загрузка и миграция старых данных
            const savedData = localStorage.getItem('amProdData');
            if (savedData) {
                const parsed = JSON.parse(savedData);
                activeProjects = parsed.map(p => {
                    if (!p.dates) {
                        return {
                            id: p.id || Date.now().toString(),
                            title: p.title,
                            dates: [{ date: p.id, start: p.timeStart || '', end: p.timeEnd || '' }],
                            cost: p.cost,
                            method: p.method,
                            isPaid: p.isPaid
                        };
                    }
                    return p;
                });
                if (activeProjects.length > 0) {
                    selectedProjectId = activeProjects[0].id;
                }
            }

            const timeline = document.getElementById('projects-timeline');
            const modal = document.getElementById('date-modal');
            const modalContent = document.getElementById('date-modal-content');
            const contentArea = document.getElementById('project-content');
            const dynamicDatesList = document.getElementById('dynamic-dates-list');
            
            const titleInput = document.getElementById('new-project-title');
            const costInput = document.getElementById('new-project-cost');
            const methodInput = document.getElementById('new-project-method');
            const calcPeople = document.getElementById('calc-people');
            const calcRate = document.getElementById('calc-rate');
            const modalTitle = document.getElementById('modal-title');
            
            const dashTotal = document.getElementById('dash-total');
            const dashPaid = document.getElementById('dash-paid');
            const dashPending = document.getElementById('dash-pending');

            function saveDataLocally() {
                localStorage.setItem('amProdData', JSON.stringify(activeProjects));
                updateDashboard();
            }

            const calculateTotal = () => {
                const people = parseFloat(calcPeople.value) || 0;
                const rate = parseFloat(calcRate.value) || 0;
                if (people > 0 && rate > 0) costInput.value = people * rate;
            };
            calcPeople.addEventListener('input', calculateTotal);
            calcRate.addEventListener('input', calculateTotal);

            // Управление строками дат в модалке
            function addDateRow(dateVal='', startVal='', endVal='') {
                const row = document.createElement('div');
                row.className = "date-row flex gap-1 items-center";
                row.innerHTML = `
                    <input type="date" class="row-date w-[45%] bg-gray-950 text-white text-xs rounded-lg p-2 outline-none border border-gray-700" style="color-scheme: dark;" value="${dateVal}" required>
                    <input type="time" class="row-start w-[22%] bg-gray-950 text-white text-xs rounded-lg p-2 outline-none border border-gray-700" style="color-scheme: dark;" value="${startVal}">
                    <span class="text-gray-500 text-xs">-</span>
                    <input type="time" class="row-end w-[22%] bg-gray-950 text-white text-xs rounded-lg p-2 outline-none border border-gray-700" style="color-scheme: dark;" value="${endVal}">
                    <button type="button" class="remove-row-btn w-[10%] text-red-500/80 hover:text-red-400 p-1 flex justify-center"><i data-lucide="x-circle" class="w-4 h-4"></i></button>
                `;
                dynamicDatesList.appendChild(row);
                lucide.createIcons({root: row});
                
                row.querySelector('.remove-row-btn').addEventListener('click', () => {
                    if(dynamicDatesList.children.length > 1) row.remove();
                    else alert('В проекте должен быть минимум один день!');
                });
            }

            document.getElementById('add-dynamic-date-btn').addEventListener('click', () => addDateRow());

            const openModal = (editMode = false) => {
                isEditMode = editMode;
                modalTitle.textContent = editMode ? 'Изменить проект' : 'Новый проект';
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.add('modal-active'), 10);
            };

            const closeModal = () => {
                modal.classList.remove('modal-active');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            document.getElementById('add-date-btn').addEventListener('click', () => {
                titleInput.value = ''; costInput.value = ''; methodInput.value = ''; calcPeople.value = ''; calcRate.value = '';
                dynamicDatesList.innerHTML = '';
                addDateRow(); // Одна пустая строка по умолчанию
                openModal(false);
            });
            
            document.getElementById('cancel-date').addEventListener('click', closeModal);

            // Сохранение проекта
            document.getElementById('save-date').addEventListener('click', () => {
                const dateRows = document.querySelectorAll('.date-row');
                const extractedDates = [];
                dateRows.forEach(row => {
                    const dVal = row.querySelector('.row-date').value;
                    if(dVal) {
                        extractedDates.push({
                            date: dVal,
                            start: row.querySelector('.row-start').value,
                            end: row.querySelector('.row-end').value
                        });
                    }
                });

                if (extractedDates.length === 0) { alert('Укажите хотя бы одну дату!'); return; }
                
                // Сортируем даты внутри проекта
                extractedDates.sort((a,b) => new Date(a.date) - new Date(b.date));

                const projectData = {
                    id: isEditMode ? selectedProjectId : Date.now().toString(),
                    title: titleInput.value || 'Без названия',
                    dates: extractedDates,
                    cost: costInput.value ? Number(costInput.value) : 0,
                    method: methodInput.value || 'Не указано',
                    isPaid: false
                };

                const existingIndex = activeProjects.findIndex(proj => proj.id === projectData.id);
                if (isEditMode && existingIndex > -1) {
                    projectData.isPaid = activeProjects[existingIndex].isPaid;
                    activeProjects[existingIndex] = projectData;
                } else {
                    activeProjects.push(projectData);
                }

                // Сортируем все проекты по первой дате
                activeProjects.sort((a, b) => new Date(a.dates[0].date) - new Date(b.dates[0].date));
                selectedProjectId = projectData.id;
                
                saveDataLocally();
                renderTimeline();
                updateContentArea();
                closeModal();
            });

            function updateDashboard() {
                let total = 0, paid = 0, pending = 0;
                activeProjects.forEach(d => {
                    total += d.cost || 0;
                    if (d.isPaid) paid += d.cost || 0;
                    else pending += d.cost || 0;
                });
                dashTotal.textContent = `${total.toLocaleString('ru-RU')} ₽`;
                dashPaid.textContent = `${paid.toLocaleString('ru-RU')} ₽`;
                dashPending.textContent = `${pending.toLocaleString('ru-RU')} ₽`;
            }

            function renderTimeline() {
                timeline.innerHTML = '';
                if (activeProjects.length > 0) {
                    contentArea.classList.remove('hidden');
                    setTimeout(() => contentArea.classList.remove('opacity-0'), 50);
                } else {
                    contentArea.classList.add('hidden', 'opacity-0');
                    timeline.innerHTML = `<div class="col-span-4 text-center text-gray-500 text-sm py-4 border border-dashed border-gray-800 rounded-2xl">Нажмите +, чтобы добавить проект</div>`;
                }

                activeProjects.forEach(project => {
                    const isActive = project.id === selectedProjectId;
                    const icon = document.createElement('button');
                    const firstDate = new Date(project.dates[0].date);
                    
                    const day = firstDate.getDate();
                    const month = new Intl.DateTimeFormat('ru-RU', { month: 'short' }).format(firstDate).replace('.', '');
                    const multiBadge = project.dates.length > 1 ? `<div class="absolute top-1 right-1 bg-red-500 text-white text-[9px] font-bold px-1 rounded-full shadow">+${project.dates.length - 1}</div>` : '';

                    const borderStyle = project.isPaid && !isActive ? 'border-green-500/40 text-green-400 bg-green-900/10' : 'border-white/10 text-gray-300 bg-gray-800/60';
                    
                    icon.className = `date-icon w-full rounded-2xl flex flex-col items-center justify-center border outline-none shadow-sm backdrop-blur-md ${isActive ? 'active text-white' : borderStyle}`;
                    
                    icon.innerHTML = `
                        ${multiBadge}
                        <span class="text-[10px] uppercase font-bold ${isActive ? 'text-white' : 'opacity-60'} mb-1 tracking-widest z-10">${month}</span>
                        <span class="text-2xl font-black leading-none ${isActive ? 'text-white' : ''} z-10">${day}</span>
                    `;
                    
                    icon.addEventListener('click', () => { 
                        selectedProjectId = project.id; 
                        renderTimeline(); 
                        updateContentArea(); 
                        document.getElementById('project-content').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                    
                    timeline.appendChild(icon);
                });
                lucide.createIcons();
            }

            // Получение погоды для виджета
            async function fetchWeatherForDate(dateStr) {
                const targetDate = new Date(dateStr);
                const today = new Date();
                today.setHours(0,0,0,0);
                const diffTime = targetDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0 || diffDays > 14) return null; 
                
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=55.7522&longitude=37.6156&daily=weathercode,temperature_2m_max&timezone=Europe%2FMoscow&start_date=${dateStr}&end_date=${dateStr}`);
                    const data = await res.json();
                    
                    if (data.daily && data.daily.weathercode && data.daily.weathercode.length > 0) {
                        const code = data.daily.weathercode[0];
                        const temp = Math.round(data.daily.temperature_2m_max[0]);
                        
                        let icon = '☀️'; let animClass = 'weather-spin';
                        if (code >= 1 && code <= 3) { icon = '⛅'; animClass = 'weather-float'; }
                        else if (code >= 45 && code <= 48) { icon = '🌫️'; animClass = 'weather-float'; }
                        else if (code >= 51 && code <= 67) { icon = '🌧️'; animClass = 'weather-rain'; }
                        else if (code >= 71 && code <= 77) { icon = '❄️'; animClass = 'weather-float'; }
                        else if (code >= 80 && code <= 82) { icon = '🌦️'; animClass = 'weather-rain'; }
                        else if (code >= 95) { icon = '⛈️'; animClass = 'weather-rain'; }
                        
                        return { icon, temp: (temp > 0 ? '+' : '') + temp + '°', animClass };
                    }
                } catch (e) { return null; }
                return null;
            }

            function updateContentArea() {
                const project = activeProjects.find(p => p.id === selectedProjectId);
                if (!project) return;

                document.getElementById('project-title-label').textContent = project.title;
                
                // Рендер списка дат с погодой
                const datesContainer = document.getElementById('project-dates-container');
                datesContainer.innerHTML = '';
                
                project.dates.forEach(async (d, index) => {
                    const dateObj = new Date(d.date);
                    const formattedDate = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).format(dateObj);
                    
                    let timeHtml = '';
                    if(d.start || d.end) {
                        timeHtml = `<div class="flex items-center gap-1.5 text-purple-400 text-[10px] font-bold bg-purple-900/20 px-2 py-1 rounded-lg border border-purple-500/20 uppercase tracking-wide">
                                        <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${d.start} ${d.start&&d.end?'-':''} ${d.end}
                                    </div>`;
                    }

                    const row = document.createElement('div');
                    row.className = "flex justify-between items-center bg-gray-900/60 p-3 rounded-2xl border border-white/5";
                    row.innerHTML = `
                        <div class="flex flex-col items-start gap-1.5">
                            <div class="flex items-center gap-1.5 text-blue-400 text-xs font-bold uppercase tracking-wide">
                                <i data-lucide="calendar" class="w-4 h-4"></i> ${formattedDate}
                            </div>
                            ${timeHtml}
                        </div>
                        <div id="weather-${project.id}-${index}" class="text-right flex flex-col items-end hidden">
                            <div class="weather-icon text-2xl mb-0.5" style="text-shadow: 0 4px 10px rgba(0,0,0,0.5);"></div>
                            <div class="weather-temp text-[10px] font-black text-gray-300 bg-black/50 rounded-full px-2 py-0.5 backdrop-blur-sm border border-white/10"></div>
                        </div>
                    `;
                    datesContainer.appendChild(row);
                    lucide.createIcons({root: row});

                    // Грузим погоду для этой даты
                    const weather = await fetchWeatherForDate(d.date);
                    if(weather) {
                        const wBox = document.getElementById(`weather-${project.id}-${index}`);
                        wBox.classList.remove('hidden');
                        wBox.querySelector('.weather-icon').textContent = weather.icon;
                        wBox.querySelector('.weather-icon').classList.add(weather.animClass);
                        wBox.querySelector('.weather-temp').textContent = weather.temp;
                    }
                });

                // Финансы
                const financeBlock = document.getElementById('finance-block');
                const projectCostLabel = document.getElementById('project-cost-label');
                const projectMethodLabel = document.getElementById('project-method-label');
                const markPaidBtn = document.getElementById('mark-paid-btn');
                const paidStatus = document.getElementById('paid-status');

                if (project.cost > 0) {
                    financeBlock.classList.remove('hidden');
                    projectCostLabel.textContent = `${project.cost.toLocaleString('ru-RU')} ₽`;
                    projectMethodLabel.textContent = project.method;
                    
                    if (project.isPaid) {
                        markPaidBtn.classList.add('hidden');
                        paidStatus.classList.remove('hidden');
                        projectCostLabel.className = 'text-2xl font-bold text-green-400';
                    } else {
                        markPaidBtn.classList.remove('hidden');
                        paidStatus.classList.add('hidden');
                        projectCostLabel.className = 'text-2xl font-bold text-white';
                    }
                } else {
                    financeBlock.classList.add('hidden');
                }
            }

            document.getElementById('mark-paid-btn').addEventListener('click', () => {
                const project = activeProjects.find(p => p.id === selectedProjectId);
                if (project) {
                    project.isPaid = true;
                    saveDataLocally();
                    updateContentArea();
                    renderTimeline();
                }
            });

            document.getElementById('delete-project-btn').addEventListener('click', () => {
                if (confirm('Точно удалить этот проект?')) {
                    activeProjects = activeProjects.filter(p => p.id !== selectedProjectId);
                    selectedProjectId = activeProjects.length > 0 ? activeProjects[0].id : null;
                    saveDataLocally();
                    renderTimeline();
                    if(selectedProjectId) updateContentArea();
                }
            });

            document.getElementById('edit-project-btn').addEventListener('click', () => {
                const project = activeProjects.find(p => p.id === selectedProjectId);
                if (project) {
                    titleInput.value = project.title;
                    costInput.value = project.cost;
                    methodInput.value = project.method;
                    calcPeople.value = ''; calcRate.value = '';
                    
                    dynamicDatesList.innerHTML = '';
                    project.dates.forEach(d => addDateRow(d.date, d.start, d.end));
                    
                    openModal(true);
                }
            });

            document.getElementById('share-project-btn').addEventListener('click', async () => {
                const project = activeProjects.find(p => p.id === selectedProjectId);
                if (!project) return;
                
                let text = `📁 Проект: ${project.title}\n\nГрафик работы:\n`;
                project.dates.forEach(d => {
                    const formatted = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' }).format(new Date(d.date));
                    text += `📅 ${formatted}`;
                    if(d.start || d.end) text += `  ⏰ ${d.start ? d.start : ''}${d.start&&d.end?'-':''}${d.end ? d.end : ''}`;
                    text += '\n';
                });
                
                text += `\n💰 Смета: ${project.cost.toLocaleString('ru-RU')} ₽\n💵 Оплата: ${project.isPaid ? '✅ Оплачено' : '⏳ Ожидается'} (${project.method})`;
                
                if (navigator.share) {
                    try { await navigator.share({ title: 'Отчет по проекту', text: text }); } 
                    catch (err) { console.log('Ошибка шаринга', err); }
                } else {
                    navigator.clipboard.writeText(text);
                    alert('Текст отчета скопирован в буфер обмена!');
                }
            });

            // Парсинг Excel
            const uploadInput = document.getElementById('excel-upload');
            const dataContainer = document.getElementById('excel-data-container');
            const emptyState = document.getElementById('excel-empty-state');

            uploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    renderExcelData(json);
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            });

            function renderExcelData(data) {
                dataContainer.innerHTML = '';
                if (emptyState) emptyState.style.display = 'none';
                const headers = data[0];
                for (let i = 1; i < data.length; i++) {
                    const row = data[i];
                    if (!row || row.length === 0) continue;
                    let cardHtml = `<div class="bg-black/30 p-4 rounded-2xl border border-white/5 shadow-sm mb-3">`;
                    row.forEach((cell, index) => {
                        const headerName = headers[index] || `Колонка ${index + 1}`;
                        if (cell !== undefined && cell !== null && cell !== '') {
                            cardHtml += `<div class="mb-2 last:mb-0 flex justify-between gap-4 border-b border-white/5 pb-2 last:border-0 last:pb-0">
                                            <span class="text-xs text-gray-500 font-bold uppercase tracking-wider">${headerName}</span>
                                            <span class="text-sm text-gray-200 text-right font-medium">${cell}</span>
                                         </div>`;
                        }
                    });
                    cardHtml += `</div>`;
                    dataContainer.innerHTML += cardHtml;
                }
            }

            renderTimeline();
            if (selectedProjectId) updateContentArea();
            updateDashboard();
        });

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW', err)));
        }
    </script>
</body>
</html>
