<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Event Kremlin">
    <link rel="apple-touch-icon" href="./icon.jpg">
    <link rel="manifest" href="manifest.json">
    
    <title>Event Production Kremlin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        .hidden-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes shimmer-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-title {
            background-size: 200% 200%;
            animation: shimmer-bg 4s ease infinite;
        }

        .date-icon {
            aspect-ratio: 1 / 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .date-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(59,130,246, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(59,130,246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59,130,246, 0); }
        }
        .date-icon.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 200% 200%;
            animation: shimmer-bg 3s ease infinite, pulse-border 2s infinite;
            border: none;
            transform: scale(1.05);
            z-index: 10;
        }
        
        .date-icon:active { transform: scale(0.9); }

        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes rain-drop { 0% { transform: translateY(-2px); opacity: 0.8; } 100% { transform: translateY(5px); opacity: 0; } }
        
        .weather-spin { display: inline-block; animation: spin-slow 10s linear infinite; }
        .weather-float { display: inline-block; animation: float 3s ease-in-out infinite; }
        .weather-rain { display: inline-block; animation: rain-drop 1.5s linear infinite; }
        
        input[type="checkbox"].team-checkbox {
            accent-color: #3b82f6;
            width: 18px;
            height: 18px;
        }
        
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased pb-24 overflow-x-hidden selection:bg-blue-500/30">

    <!-- Заголовок -->
    <div class="pt-14 pb-4 px-4 text-center">
        <h1 class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-blue-400 animated-title inline-flex items-center gap-2 justify-center w-full">
            Event Kremlin
            <i data-lucide="cloud" id="sync-icon" class="w-6 h-6 text-gray-700 transition-colors"></i>
        </h1>
    </div>

    <!-- Дашборд -->
    <div class="px-4 grid grid-cols-3 gap-3 mb-3">
        <div class="bg-green-900/20 p-3 rounded-2xl border border-green-500/30 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(34,197,94,0.1)] transition-transform duration-200" id="dash-card-paid">
            <div class="text-[10px] text-green-500/90 uppercase tracking-wider mb-1 font-semibold">Оплачено</div>
            <div class="text-sm font-bold text-green-400" id="dash-paid">0 ₽</div>
        </div>
        <div class="bg-yellow-900/20 p-3 rounded-2xl border border-yellow-500/30 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(234,179,8,0.1)] transition-transform duration-200" id="dash-card-pending">
            <div class="text-[10px] text-yellow-500/90 uppercase tracking-wider mb-1 font-semibold">Остаток</div>
            <div class="text-sm font-bold text-yellow-400" id="dash-pending">0 ₽</div>
        </div>
        <div class="bg-blue-900/20 p-3 rounded-2xl border border-blue-500/30 flex flex-col items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.1)] transition-transform duration-200" id="dash-card-total">
            <div class="text-[10px] text-blue-400/90 uppercase tracking-wider mb-1 font-semibold">Всего</div>
            <div class="text-sm font-bold text-blue-400" id="dash-total">0 ₽</div>
        </div>
    </div>
    
    <!-- Фильтр Дашборда -->
    <div class="px-4 mb-6 relative">
        <div class="absolute inset-y-0 left-7 flex items-center pointer-events-none">
            <i data-lucide="users" class="w-4 h-4 text-gray-400" id="filter-icon"></i>
        </div>
        <select id="dashboard-team-filter" class="w-full bg-gray-800/80 text-white text-[16px] font-bold rounded-xl py-3 pl-10 pr-10 outline-none border border-white/10 appearance-none shadow-sm transition-colors focus:border-blue-500 cursor-pointer">
            <option value="Все проекты">Все проекты</option>
            <option value="Весь ФОТ">Весь ФОТ</option>
        </select>
        <div class="absolute inset-y-0 right-7 flex items-center pointer-events-none">
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
        </div>
    </div>

    <!-- Кнопки -->
    <div class="px-4 flex gap-3 mb-8">
        <label class="flex-1 bg-gray-800/80 hover:bg-gray-700 backdrop-blur-md text-white py-3.5 px-2 rounded-2xl cursor-pointer transition-colors border border-white/10 flex items-center justify-center gap-2 relative overflow-hidden">
            <i data-lucide="file-spreadsheet" class="w-5 h-5 text-green-400"></i>
            <span class="text-xs font-bold uppercase tracking-wider">Загрузить Excel</span>
            <input type="file" id="excel-upload" class="hidden" accept=".xlsx, .xls">
        </label>
        <button id="add-date-btn" type="button" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3.5 px-2 rounded-2xl transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] border border-blue-400/30 flex items-center justify-center gap-2 cursor-pointer active:scale-95">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span class="text-xs font-bold uppercase tracking-wider">Добавить</span>
        </button>
    </div>

    <!-- Сетка проектов -->
    <div class="px-4 mb-8">
        <div id="projects-timeline" class="grid grid-cols-4 gap-3"></div>
    </div>

    <!-- Детальная карточка проекта -->
    <div id="project-content" class="px-4 hidden opacity-0 transition-opacity duration-500 scroll-mt-6">
        <div class="bg-gray-900/40 backdrop-blur-xl border border-white/10 rounded-3xl p-5 shadow-2xl relative">
            <div class="mb-5 border-b border-white/5 pb-4 relative">
                <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1 hidden" id="project-contractor-label">Контрагент</div>
                <h2 id="project-title-label" class="text-2xl font-bold mb-3 text-white leading-tight">Название проекта</h2>
                
                <div id="project-location-container" class="mb-4"></div>
                <div id="project-dates-container" class="flex flex-col gap-2"></div>
            </div>

            <!-- Управление -->
            <div class="flex gap-2 mb-6">
                <button id="edit-project-btn" class="flex-1 bg-gray-800/80 text-gray-300 py-3 rounded-xl text-xs font-bold uppercase tracking-wide flex justify-center items-center gap-2 border border-white/5 active:scale-95 transition-transform">
                    <i data-lucide="edit" class="w-4 h-4"></i> Изменить
                </button>
                <button id="share-project-btn" class="flex-1 bg-blue-900/30 text-blue-400 py-3 rounded-xl text-xs font-bold uppercase tracking-wide flex justify-center items-center gap-2 border border-blue-500/20 active:scale-95 transition-transform">
                    <i data-lucide="send" class="w-4 h-4"></i> Отправить
                </button>
                <button id="delete-project-btn" class="flex-1 bg-red-900/20 text-red-400 py-3 rounded-xl text-xs font-bold uppercase tracking-wide flex justify-center items-center gap-2 border border-red-500/20 active:scale-95 transition-transform">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Удалить
                </button>
            </div>

            <!-- Блок Команды (ФОТ) -->
            <div id="project-team-container" class="bg-black/20 border border-white/5 p-4 rounded-2xl mb-6 hidden">
                <div class="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                    <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Команда на проекте</div>
                    <div class="text-[10px] text-blue-400 font-bold bg-blue-900/20 px-2 py-1 rounded-lg border border-blue-500/20">ФОТ: <span id="project-team-total">0 ₽</span></div>
                </div>
                <div id="project-team-list" class="space-y-2 pt-1"></div>
            </div>

            <!-- Финансы общие -->
            <div id="finance-block" class="bg-black/20 border border-white/5 p-4 rounded-2xl mb-6 hidden">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Итоговая смета</div>
                        <div id="project-cost-label" class="text-2xl font-bold text-white">0 ₽</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Способ оплаты</div>
                        <div id="project-method-label" class="text-sm text-gray-300 font-medium">Наличные</div>
                    </div>
                </div>
                
                <div id="payment-actions">
                    <button id="mark-paid-btn" class="w-full bg-gradient-to-r from-blue-600/20 to-purple-600/20 text-blue-400 hover:from-blue-600/30 hover:to-purple-600/30 font-bold py-3 rounded-xl transition-colors border border-blue-500/30 flex justify-center items-center gap-2">
                        <i data-lucide="circle-dollar-sign" class="w-5 h-5"></i> Отметить как оплаченное
                    </button>
                    <div id="paid-status" class="hidden w-full bg-green-500/10 text-green-400 font-bold py-3 rounded-xl border border-green-500/20 flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(34,197,94,0.1)]">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i> Оплачено
                    </div>
                </div>
            </div>

            <!-- Excel списки -->
            <div class="flex justify-between items-center mb-4 mt-2">
                <h3 class="text-lg font-bold">Списки на площадку</h3>
            </div>
            <div id="excel-data-container" class="space-y-3 pb-2">
                <div class="text-center text-gray-600 mt-4 text-sm border border-dashed border-gray-700/50 rounded-2xl p-6 bg-gray-900/20" id="excel-empty-state">
                    <i data-lucide="list-x" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
                    Таблицы не загружены
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно (Новый проект) -->
    <div id="date-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-[2rem] w-full max-w-[360px] shadow-2xl relative max-h-[90vh] overflow-y-auto hidden-scrollbar" id="date-modal-content">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-purple-500"></div>
            
            <h3 id="modal-title" class="text-lg font-bold mb-4 text-center mt-2">Новый проект</h3>
            
            <div class="space-y-4 mb-6">
                <!-- Основное -->
                <input type="text" id="new-project-title" placeholder="Название проекта" class="w-full bg-gray-950 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
                <input type="text" id="new-project-contractor" placeholder="Контрагент (Агентство/Клиент)" class="w-full bg-gray-950 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
                
                <!-- Локация и Метро -->
                <div class="flex flex-col gap-2 bg-gray-800/30 p-2 rounded-xl border border-gray-700/50">
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <span class="absolute left-3 top-3 text-gray-400"><i data-lucide="map-pin" class="w-4 h-4"></i></span>
                            <input type="text" id="new-project-address" placeholder="Точный адрес площадки" class="w-full bg-gray-950 text-white text-sm rounded-xl py-3 pl-9 pr-3 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
                        </div>
                        <button type="button" id="get-location-btn" class="bg-blue-900/30 text-blue-400 px-3 rounded-xl border border-blue-500/30 hover:bg-blue-900/50 transition-colors flex items-center justify-center" title="Определить геопозицию">
                            <i data-lucide="navigation" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-red-500 font-bold text-xs border border-red-500/50 rounded-full w-4 h-4 flex items-center justify-center">M</span>
                        <input type="text" id="new-project-metro" placeholder="Метро (напр. Охотный ряд, 5 мин)" class="w-full bg-gray-950 text-white text-sm rounded-xl py-3 pl-9 pr-4 outline-none border border-gray-700 block transition-colors focus:border-red-500/50">
                    </div>
                </div>
                
                <!-- Блок Дат -->
                <div class="bg-gray-800/30 p-3 rounded-xl border border-gray-700/50">
                    <div class="text-[10px] text-gray-400 font-bold uppercase mb-2 ml-1">График работы (Даты и Тайминг)</div>
                    <div id="dynamic-dates-list" class="space-y-2 mb-3"></div>
                    <button type="button" id="add-dynamic-date-btn" class="w-full bg-gray-800/80 hover:bg-gray-700 text-blue-400 text-[11px] font-bold uppercase py-2.5 rounded-lg border border-gray-700 transition-colors flex justify-center items-center gap-1">
                        <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i> Добавить день
                    </button>
                </div>

                <!-- Блок Выбора команды -->
                <div class="bg-gray-800/30 p-3 rounded-xl border border-gray-700/50">
                    <div class="flex justify-between items-center mb-3 ml-1">
                        <div class="text-[10px] text-gray-400 font-bold uppercase">Команда и Гонорары (ФОТ)</div>
                        <div class="text-[10px] text-blue-400 font-bold bg-blue-900/20 px-2 py-0.5 rounded border border-blue-500/20">ФОТ: <span id="team-total-calc">0</span> ₽</div>
                    </div>
                    <div id="team-selection-list" class="space-y-2 mb-3"></div>
                    <button type="button" id="add-custom-member-btn" class="w-full bg-gray-800/80 hover:bg-gray-700 text-purple-400 text-[11px] font-bold uppercase py-2.5 rounded-lg border border-gray-700 transition-colors flex justify-center items-center gap-1">
                        <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Добавить человека
                    </button>
                </div>

                <!-- Сумма и Оплата общие -->
                <div class="relative mt-2">
                    <span class="absolute left-4 top-3 text-gray-500 font-medium">₽</span>
                    <input type="number" id="new-project-cost" placeholder="Итоговая смета (все расходы)" class="w-full bg-gray-950 text-white text-sm rounded-xl py-3 pl-9 pr-4 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
                </div>
                <div class="relative">
                    <span class="absolute right-3 top-3 text-gray-400 pointer-events-none"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
                    <select id="new-project-method" class="w-full bg-gray-950 text-white text-sm rounded-xl p-3 pr-9 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
                        <option value="Наличные">Наличные</option>
                        <option value="Банковская карта">Банковская карта</option>
                        <option value="СЗ">СЗ (Самозанятый)</option>
                        <option value="ИП">ИП</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="cancel-date" type="button" class="flex-1 py-3 rounded-xl bg-gray-800 text-gray-300 font-bold uppercase tracking-wide text-xs active:scale-95 transition-transform">Отмена</button>
                <button id="save-date" type="button" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold uppercase tracking-wide text-xs active:scale-95 transition-transform shadow-lg shadow-blue-500/30">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yixpxokoinvmphgvdsee.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpeHB4b2tvaW52bXBoZ3Zkc2VlIiwicm9sZSI6InlpeHB4b2tvaW52bXBoZ3Zkc2VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjEyMTgsImV4cCI6MjEwNTMzNzIxOH0.vwtkVEbxr5yzd5GNF4PBZlvRZIvVrFGQoh5EfNPpojE';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const PREDEFINED_TEAM = [
                "Зломанов Олег Викторович",
                "Дубовой Андрей Николаевич",
                "Дубовой Алексей Николаевич",
                "Смутный Богдан Сергеевич"
            ];

            let activeProjects = [];
            let selectedProjectId = null;
            let isEditMode = false;
            let currentDashFilter = 'Все проекты'; 

            const syncIcon = document.getElementById('sync-icon');

            const savedData = localStorage.getItem('amProdData');
            if (savedData) {
                activeProjects = JSON.parse(savedData);
                if (activeProjects.length > 0) selectedProjectId = activeProjects[0].id;
                renderDashboardFilters();
                renderTimeline();
                if (selectedProjectId) updateContentArea();
                updateDashboard();
            }

            async function fetchFromCloud() {
                try {
                    syncIcon.classList.add('animate-pulse', 'text-blue-400');
                    const { data, error } = await _supabase.from('am_projects').select('*');
                    if (data && !error && data.length > 0) {
                        activeProjects = data.map(d => d.project_data);
                        activeProjects.sort((a, b) => new Date(a.dates[0].date) - new Date(b.dates[0].date));
                        if(activeProjects.length > 0 && !selectedProjectId) selectedProjectId = activeProjects[0].id;
                        
                        localStorage.setItem('amProdData', JSON.stringify(activeProjects));
                        renderDashboardFilters();
                        renderTimeline();
                        if(selectedProjectId) updateContentArea();
                        updateDashboard();
                    }
                    syncIcon.classList.remove('animate-pulse', 'text-blue-400');
                    syncIcon.classList.add('text-green-500');
                    setTimeout(() => syncIcon.classList.replace('text-green-500', 'text-gray-700'), 3000);
                } catch (e) {
                    syncIcon.classList.remove('animate-pulse', 'text-blue-400');
                    syncIcon.classList.add('text-gray-700');
                }
            }
            fetchFromCloud();

            async function syncData(projectToUpsert = null, idToDelete = null) {
                localStorage.setItem('amProdData', JSON.stringify(activeProjects));
                renderDashboardFilters();
                updateDashboard();

                syncIcon.classList.add('animate-pulse', 'text-blue-400');
                try {
                    if (idToDelete) await _supabase.from('am_projects').delete().eq('id', idToDelete);
                    if (projectToUpsert) await _supabase.from('am_projects').upsert({ id: projectToUpsert.id, project_data: projectToUpsert });
                    syncIcon.classList.remove('animate-pulse', 'text-blue-400');
                    syncIcon.classList.add('text-green-500');
                    setTimeout(() => syncIcon.classList.replace('text-green-500', 'text-gray-700'), 2000);
                } catch (e) {
                    syncIcon.classList.remove('animate-pulse', 'text-blue-400');
                    syncIcon.classList.add('text-red-500');
                }
            }

            const modal = document.getElementById('date-modal');
            const dynamicDatesList = document.getElementById('dynamic-dates-list');
            const teamSelectionList = document.getElementById('team-selection-list');
            
            const titleInput = document.getElementById('new-project-title');
            const contractorInput = document.getElementById('new-project-contractor');
            const addressInput = document.getElementById('new-project-address');
            const metroInput = document.getElementById('new-project-metro');
            const costInput = document.getElementById('new-project-cost');
            const methodInput = document.getElementById('new-project-method');
            const modalTitle = document.getElementById('modal-title');
            
            const dashTotal = document.getElementById('dash-total');
            const dashPaid = document.getElementById('dash-paid');
            const dashPending = document.getElementById('dash-pending');
            const filterSelect = document.getElementById('dashboard-team-filter');

            // --- УПРАВЛЕНИЕ МОДАЛЬНЫМ ОКНОМ ---
            const openModal = (editMode = false) => {
                isEditMode = editMode;
                modalTitle.textContent = editMode ? 'Изменить проект' : 'Новый проект';
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            };

            const closeModal = () => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            };

            document.getElementById('add-date-btn').addEventListener('click', () => {
                titleInput.value = ''; contractorInput.value = ''; addressInput.value = ''; metroInput.value = '';
                costInput.value = ''; methodInput.value = 'Наличные';
                dynamicDatesList.innerHTML = '';
                addDateRow();
                renderTeamSelection([]);
                openModal(false);
            });
            
            document.getElementById('cancel-date').addEventListener('click', closeModal);

            // --- КНОПКА ГЕОЛОКАЦИИ ---
            document.getElementById('get-location-btn').addEventListener('click', () => {
                const btn = document.getElementById('get-location-btn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`;
                lucide.createIcons({root: btn});
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        const {latitude, longitude} = pos.coords;
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&accept-language=ru`);

                            if(data && data.address) {
                                let street = data.address.road || '';
                                let house = data.address.house_number || '';
                                let city = data.address.city || data.address.town || '';
                                let fullAddress = `${city ? city + ', ' : ''}${street} ${house}`.trim();
                                if(!fullAddress) fullAddress = data.display_name;
                                addressInput.value = fullAddress;
                            }
                        } catch(e) { console.error(e); alert('Не удалось получить адрес'); }
                        btn.innerHTML = originalHtml;
                    }, () => {
                        alert('Доступ к геолокации запрещен');

                    });

                    alert('Ваш браузер не поддерживает геолокацию');

            // --- ДАШБОРД (ФИЛЬТРЫ) ---
            function renderDashboardFilters() {
                filterSelect.innerHTML = '';
                const filters = ['Все проекты', 'Весь ФОТ', ...PREDEFINED_TEAM];
                activeProjects.forEach(p => {
                    (p.team || []).forEach(m => {
                        if (!filters.includes(m.name)) filters.push(m.name);
                    });
                });

                filters.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f;
                    if (currentDashFilter === f) opt.selected = true;
                    filterSelect.appendChild(opt);
                });
            }

            filterSelect.addEventListener('change', (e) => {
                currentDashFilter = e.target.value;
                updateDashboard();
            });

            function updateDashboard() {
                let total = 0, paid = 0, pending = 0;
                activeProjects.forEach(p => {
                    if (currentDashFilter === 'Все проекты') {
                        total += p.cost || 0;
                        if (p.isPaid) paid += p.cost || 0;
                        else pending += p.cost || 0;
                    } else if (currentDashFilter === 'Весь ФОТ') {
                        let projectFot = 0;
                        p.team.forEach(m => projectFot += m.fee);
                        total += projectFot;
                        if (p.isPaid) paid += projectFot;
                        else pending += projectFot;
                    } else {
                        const member = (p.team || []).find(m => m.name === currentDashFilter);
                        if (member) {
                            total += member.fee || 0;
                            if (p.isPaid) paid += member.fee || 0;
                            else pending += member.fee || 0;
                        }
                    }
                });

                dashTotal.textContent = `${total.toLocaleString('ru-RU')} ₽`;
                dashPaid.textContent = `${paid.toLocaleString('ru-RU')} ₽`;
                dashPending.textContent = `${pending.toLocaleString('ru-RU')} ₽`;
            }

            function renderTeamSelection(existingTeam = []) {
                teamSelectionList.innerHTML = '';

                    const memberData = existingTeam.find(m => m.name === name) || { fee: '' };

            function addTeamMemberRow(name = '', fee = '', isChecked = false, isPredefined = false) {
                const row = document.createElement('div');
                row.className = "custom-team-row flex justify-between items-center bg-gray-950 p-2 rounded-lg border border-gray-700/80 gap-2";
                
                if (isPredefined) {
                    row.innerHTML = `

                        <input type="number" class="team-fee w-20 shrink-0 bg-gray-900 text-white text-xs rounded p-1.5 outline-none border border-gray-600 focus:border-blue-500 transition-colors text-right ${isChecked ? '' : 'opacity-30'}" placeholder="0 ₽" value="${fee}" ${isChecked ? '' : 'disabled'}>
                    `;
                } else {
                    row.innerHTML = `

                    `;

            async function fetchWeatherForDate(dateStr) {
                const targetDate = new Date(dateStr);
                const today = new Date();
                today.setHours(0,0,0,0);
                const diffTime = targetDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0 || diffDays > 14) return null; 
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=55.7522&longitude=37.6156&daily=weathercode,temperature_2m_max&timezone=Europe%2FMoscow&start_date=${dateStr}&end_date=${dateStr}`);
                    const data = await res.json();
                    if (data.daily && data.daily.weathercode && data.daily.weathercode.length > 0) {
                        const code = data.daily.weathercode[0];
                        const temp = Math.round(data.daily.temperature_2m_max[0]);
                        let icon = '☀️'; let animClass = 'weather-spin';
                        if (code >= 1 && code <= 3) { icon = '⛅'; animClass = 'weather-float'; }
                        else if (code >= 45 && code <= 48) { icon = '🌫️'; animClass = 'weather-float'; }
                        else if (code >= 51 && code <= 67) { icon = '🌧️'; animClass = 'weather-rain'; }
                        else if (code >= 71 && code <= 77) { icon = '❄️'; animClass = 'weather-float'; }
                        else if (code >= 80 && code <= 82) { icon = '🌦️'; animClass = 'weather-rain'; }
                        else if (code >= 95) { icon = '⛈️'; animClass = 'weather-rain'; }
                        return { icon, temp: (temp > 0 ? '+' : '') + temp + '°', animClass };
                    }
                } catch (e) { return null; }
                return null;
            }

            const uploadInput = document.getElementById('excel-upload');

            const emptyState = document.getElementById('excel-empty-state');

            uploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    renderExcelData(json);
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            });

            function renderExcelData(data) {
                dataContainer.innerHTML = '';
                if (emptyState) emptyState.style.display = 'none';
                const headers = data[0];
                for (let i = 1; i < data.length; i++) {
                    const row = data[i];
                    if (!row || row.length === 0) continue;
                    let cardHtml = `<div class="bg-black/30 p-4 rounded-2xl border border-white/5 shadow-sm mb-3">`;
                    row.forEach((cell, index) => {
                        const headerName = headers[index] || `Колонка ${index + 1}`;
                        if (cell !== undefined && cell !== null && cell !== '') {
                            cardHtml += `<div class="mb-2 last:mb-0 flex justify-between gap-4 border-b border-white/5 pb-2 last:border-0 last:pb-0">
                                            <span class="text-xs text-gray-500 font-bold uppercase tracking-wider">${headerName}</span>
                                            <span class="text-sm text-gray-200 text-right font-medium">${cell}</span>
                                         </div>`;
                        }
                    });
                    cardHtml += `</div>`;
                    dataContainer.innerHTML += cardHtml;
                }
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW', err)));
        }
    </script>
</body>
</html>
