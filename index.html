<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Meta Tags для iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Event Kremlin">
    <link rel="apple-touch-icon" href="./icon.jpg">
    <link rel="manifest" href="manifest.json">
    
    <title>Event Production Kremlin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .ios-header {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding-top: max(3rem, env(safe-area-inset-top));
        }
        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        .hidden-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-active { opacity: 1 !important; }
        .modal-active > #date-modal-content { transform: scale(1) !important; }
        .date-icon { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .date-icon:active { transform: scale(0.9); }
        .date-icon.active { transform: translateY(-2px); box-shadow: 0 8px 16px -4px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased pb-24 selection:bg-blue-500/30">

    <!-- Header & Dashboard -->
    <header class="ios-header fixed top-0 w-full z-40 border-b border-white/10 pb-3">
        <div class="px-4 flex justify-between items-center mb-4">
            <h1 class="text-lg font-semibold tracking-tight truncate pr-2">Event Production Kremlin</h1>
            <div class="flex gap-3">
                <label class="bg-gray-800 hover:bg-gray-700 text-white p-2.5 rounded-full cursor-pointer transition-colors shadow-lg relative">
                    <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
                    <input type="file" id="excel-upload" class="hidden" accept=".xlsx, .xls">
                </label>
                <button id="add-date-btn" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-full transition-colors shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Глобальный дашборд -->
        <div class="px-4 flex justify-between gap-2">
            <div class="bg-gray-900/60 p-2.5 rounded-xl border border-white/5 flex-1">
                <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-0.5">Всего</div>
                <div class="text-sm font-bold text-white" id="dash-total">0 ₽</div>
            </div>
            <div class="bg-green-900/20 p-2.5 rounded-xl border border-green-500/20 flex-1">
                <div class="text-[10px] text-green-500/80 uppercase tracking-wider mb-0.5">Оплачено</div>
                <div class="text-sm font-bold text-green-400" id="dash-paid">0 ₽</div>
            </div>
            <div class="bg-yellow-900/20 p-2.5 rounded-xl border border-yellow-500/20 flex-1">
                <div class="text-[10px] text-yellow-500/80 uppercase tracking-wider mb-0.5">Остаток</div>
                <div class="text-sm font-bold text-yellow-400" id="dash-pending">0 ₽</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-40 h-screen overflow-y-auto hidden-scrollbar">
        <!-- Кружки дат -->
        <div class="px-4 pb-2">
            <div id="dates-timeline" class="flex gap-4 overflow-x-auto hidden-scrollbar pb-2 snap-x">
                <div class="text-gray-500 text-sm mt-2 w-full text-center" id="timeline-empty">Нажмите +, чтобы добавить проект</div>
            </div>
        </div>

        <!-- Контент выбранного проекта -->
        <div id="date-content" class="px-4 mt-2 hidden">
            
            <div class="mb-4">
                <h2 id="project-title-label" class="text-2xl font-bold mb-1">Название проекта</h2>
                <div class="flex items-center gap-2 text-gray-400 text-sm">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span id="current-date-label">Дата</span>
                </div>
            </div>

            <!-- Управление проектом (Редактировать / Удалить / Шеринг) -->
            <div class="flex gap-2 mb-6">
                <button id="edit-project-btn" class="flex-1 bg-gray-800 text-gray-300 py-2.5 rounded-xl text-sm font-medium flex justify-center items-center gap-2 border border-white/5">
                    <i data-lucide="edit" class="w-4 h-4"></i> Изменить
                </button>
                <button id="share-project-btn" class="flex-1 bg-blue-900/30 text-blue-400 py-2.5 rounded-xl text-sm font-medium flex justify-center items-center gap-2 border border-blue-500/20">
                    <i data-lucide="send" class="w-4 h-4"></i> Отправить
                </button>
                <button id="delete-project-btn" class="flex-1 bg-red-900/20 text-red-400 py-2.5 rounded-xl text-sm font-medium flex justify-center items-center gap-2 border border-red-500/20">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Удалить
                </button>
            </div>

            <!-- Финансовый блок -->
            <div id="finance-block" class="bg-gray-900/50 border border-white/5 p-4 rounded-2xl mb-6 shadow-sm hidden">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <div class="text-xs text-gray-500 font-medium uppercase tracking-wide mb-1">Смета</div>
                        <div id="project-cost-label" class="text-xl font-bold text-white">0 ₽</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-gray-500 font-medium uppercase tracking-wide mb-1">Способ оплаты</div>
                        <div id="project-method-label" class="text-sm text-gray-300">Наличные</div>
                    </div>
                </div>
                
                <div id="payment-actions" class="pt-3 border-t border-white/5 mt-1">
                    <button id="mark-paid-btn" class="w-full bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 font-medium py-2.5 rounded-xl transition-colors border border-blue-500/30 flex justify-center items-center gap-2">
                        <i data-lucide="circle-dollar-sign" class="w-4 h-4"></i> Отметить как оплаченное
                    </button>
                    <div id="paid-status" class="hidden w-full bg-green-500/10 text-green-400 font-medium py-2.5 rounded-xl border border-green-500/20 flex justify-center items-center gap-2">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i> Оплачено
                    </div>
                </div>
            </div>

            <!-- Списки из Excel -->
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold">Списки на площадку</h3>
            </div>
            <div id="excel-data-container" class="space-y-3 pb-8">
                <div class="text-center text-gray-600 mt-6 text-sm border border-dashed border-gray-800 rounded-2xl p-6" id="excel-empty-state">
                    <i data-lucide="list-x" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
                    Таблицы не загружены
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Добавление/Изменение проекта -->
    <div id="date-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-[2rem] w-full max-w-xs shadow-2xl transform scale-95 transition-transform duration-300" id="date-modal-content">
            <h3 id="modal-title" class="text-lg font-semibold mb-5 text-center">Новый проект</h3>
            
            <div class="space-y-3 mb-6">
                <input type="date" id="new-date-input" class="w-full bg-gray-800 text-white rounded-xl p-3 outline-none border border-gray-700 block focus:border-blue-500 transition-colors" style="color-scheme: dark;" required>
                <input type="text" id="new-project-title" placeholder="Название (например, ВДНХ)" class="w-full bg-gray-800 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
                
                <!-- Калькулятор: Люди * Ставка -->
                <div class="flex gap-2">
                    <input type="number" id="calc-people" placeholder="Кол-во чел." class="w-1/2 bg-gray-800 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 focus:border-blue-500">
                    <input type="number" id="calc-rate" placeholder="Ставка, ₽" class="w-1/2 bg-gray-800 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 focus:border-blue-500">
                </div>

                <div class="relative">
                    <span class="absolute left-4 top-3 text-gray-500 font-medium">₽</span>
                    <input type="number" id="new-project-cost" placeholder="Итоговая сумма" class="w-full bg-gray-800 text-white text-sm rounded-xl py-3 pl-9 pr-4 outline-none border border-gray-700 block transition-colors border-blue-500/30">
                </div>
                <input type="text" id="new-project-method" placeholder="Способ (нал, карта, ИП)" class="w-full bg-gray-800 text-white text-sm rounded-xl p-3 outline-none border border-gray-700 block transition-colors focus:border-blue-500">
            </div>

            <div class="flex gap-3">
                <button id="cancel-date" class="flex-1 py-3 rounded-xl bg-gray-800 text-gray-300 font-medium active:scale-95 transition-transform">Отмена</button>
                <button id="save-date" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-medium active:scale-95 transition-transform shadow-lg shadow-blue-500/30">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            let activeDates = [];
            let selectedDateId = null;
            let isEditMode = false;

            // Загрузка данных из Local Storage
            const savedData = localStorage.getItem('amProdData');
            if (savedData) {
                activeDates = JSON.parse(savedData);
                if (activeDates.length > 0) {
                    selectedDateId = activeDates[0].id;
                }
            }

            // Элементы
            const timeline = document.getElementById('dates-timeline');
            const timelineEmpty = document.getElementById('timeline-empty');
            const modal = document.getElementById('date-modal');
            const modalContent = document.getElementById('date-modal-content');
            const contentArea = document.getElementById('date-content');
            
            // Форма
            const dateInput = document.getElementById('new-date-input');
            const titleInput = document.getElementById('new-project-title');
            const costInput = document.getElementById('new-project-cost');
            const methodInput = document.getElementById('new-project-method');
            const calcPeople = document.getElementById('calc-people');
            const calcRate = document.getElementById('calc-rate');
            const modalTitle = document.getElementById('modal-title');
            
            // Дашборд и контент
            const dashTotal = document.getElementById('dash-total');
            const dashPaid = document.getElementById('dash-paid');
            const dashPending = document.getElementById('dash-pending');

            // Сохранение в Local Storage
            function saveDataLocally() {
                localStorage.setItem('amProdData', JSON.stringify(activeDates));
                updateDashboard();
            }

            // Умный калькулятор
            const calculateTotal = () => {
                const people = parseFloat(calcPeople.value) || 0;
                const rate = parseFloat(calcRate.value) || 0;
                if (people > 0 && rate > 0) costInput.value = people * rate;
            };
            calcPeople.addEventListener('input', calculateTotal);
            calcRate.addEventListener('input', calculateTotal);

            // Модальное окно
            const openModal = (editMode = false) => {
                isEditMode = editMode;
                modalTitle.textContent = editMode ? 'Изменить проект' : 'Новый проект';
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.add('modal-active'), 10);
            };

            const closeModal = () => {
                modal.classList.remove('modal-active');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            // Кнопка "Добавить"
            document.getElementById('add-date-btn').addEventListener('click', () => {
                dateInput.value = ''; 
                titleInput.value = ''; 
                costInput.value = ''; 
                methodInput.value = ''; 
                calcPeople.value = ''; 
                calcRate.value = '';
                openModal(false);
            });
            
            document.getElementById('cancel-date').addEventListener('click', closeModal);

            // Сохранение проекта
            document.getElementById('save-date').addEventListener('click', () => {
                if (!dateInput.value) return;

                const dateStr = dateInput.value;
                const dateParts = dateStr.split('-');
                const d = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);

                const projectData = {
                    id: dateStr,
                    day: d.getDate(),
                    month: new Intl.DateTimeFormat('ru-RU', { month: 'short' }).format(d).replace('.', ''),
                    full: new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).format(d),
                    title: titleInput.value || 'Без названия',
                    cost: costInput.value ? Number(costInput.value) : 0,
                    method: methodInput.value || 'Не указано',
                    isPaid: false
                };

                const existingIndex = activeDates.findIndex(proj => proj.id === projectData.id);
                
                if (isEditMode && existingIndex > -1) {
                    projectData.isPaid = activeDates[existingIndex].isPaid;
                    activeDates[existingIndex] = projectData;
                } else {
                    if (existingIndex > -1) activeDates[existingIndex] = projectData;
                    else activeDates.push(projectData);
                }

                // Сортировка по дате
                activeDates.sort((a, b) => new Date(a.id) - new Date(b.id));
                
                selectedDateId = projectData.id;
                saveDataLocally();
                renderTimeline();
                updateContentArea();
                closeModal();
            });

            // Обновление верхнего дашборда
            function updateDashboard() {
                let total = 0, paid = 0, pending = 0;
                activeDates.forEach(d => {
                    total += d.cost || 0;
                    if (d.isPaid) paid += d.cost || 0;
                    else pending += d.cost || 0;
                });
                dashTotal.textContent = `${total.toLocaleString('ru-RU')} ₽`;
                dashPaid.textContent = `${paid.toLocaleString('ru-RU')} ₽`;
                dashPending.textContent = `${pending.toLocaleString('ru-RU')} ₽`;
            }

            // Отрисовка ленты
            function renderTimeline() {
                timeline.innerHTML = '';
                if (activeDates.length > 0) {
                    if(timelineEmpty) timelineEmpty.style.display = 'none';
                    contentArea.classList.remove('hidden');
                } else {
                    if(timelineEmpty) timelineEmpty.style.display = 'block';
                    contentArea.classList.add('hidden');
                }

                activeDates.forEach(date => {
                    const isActive = date.id === selectedDateId;
                    const icon = document.createElement('button');
                    const borderStyle = date.isPaid && !isActive ? 'border-green-500/50' : 'border-white/10';
                    let baseClasses = 'date-icon snap-center shrink-0 w-16 h-16 rounded-2xl flex flex-col items-center justify-center border outline-none ';
                    
                    if (isActive) icon.className = baseClasses + 'bg-gradient-to-b from-blue-500 to-blue-600 border-blue-400 text-white';
                    else icon.className = baseClasses + `bg-gray-800/80 backdrop-blur-md ${borderStyle} text-gray-400`;
                    
                    icon.innerHTML = `<span class="text-[10px] uppercase font-semibold ${isActive ? 'text-blue-100' : 'opacity-50'} mb-0.5 tracking-wider">${date.month}</span>
                                      <span class="text-2xl font-bold leading-none ${isActive ? 'text-white' : 'text-gray-200'}">${date.day}</span>`;
                    
                    icon.addEventListener('click', () => { selectedDateId = date.id; renderTimeline(); updateContentArea(); });
                    timeline.appendChild(icon);
                });
                lucide.createIcons();
            }

            // Обновление контента проекта
            function updateContentArea() {
                const date = activeDates.find(d => d.id === selectedDateId);
                if (!date) return;

                document.getElementById('current-date-label').textContent = date.full;
                document.getElementById('project-title-label').textContent = date.title;

                const financeBlock = document.getElementById('finance-block');
                const projectCostLabel = document.getElementById('project-cost-label');
                const projectMethodLabel = document.getElementById('project-method-label');
                const markPaidBtn = document.getElementById('mark-paid-btn');
                const paidStatus = document.getElementById('paid-status');

                if (date.cost > 0) {
                    financeBlock.classList.remove('hidden');
                    projectCostLabel.textContent = `${date.cost.toLocaleString('ru-RU')} ₽`;
                    projectMethodLabel.textContent = date.method;
                    
                    if (date.isPaid) {
                        markPaidBtn.classList.add('hidden');
                        paidStatus.classList.remove('hidden');
                        projectCostLabel.className = 'text-xl font-bold text-green-400';
                    } else {
                        markPaidBtn.classList.remove('hidden');
                        paidStatus.classList.add('hidden');
                        projectCostLabel.className = 'text-xl font-bold text-white';
                    }
                } else {
                    financeBlock.classList.add('hidden');
                }
            }

            // Кнопка оплаты
            document.getElementById('mark-paid-btn').addEventListener('click', () => {
                const date = activeDates.find(d => d.id === selectedDateId);
                if (date) {
                    date.isPaid = true;
                    saveDataLocally();
                    updateContentArea();
                    renderTimeline();
                }
            });

            // Кнопка Удалить
            document.getElementById('delete-project-btn').addEventListener('click', () => {
                if (confirm('Точно удалить этот проект?')) {
                    activeDates = activeDates.filter(d => d.id !== selectedDateId);
                    selectedDateId = activeDates.length > 0 ? activeDates[0].id : null;
                    saveDataLocally();
                    renderTimeline();
                    if(selectedDateId) updateContentArea();
                }
            });

            // Кнопка Изменить
            document.getElementById('edit-project-btn').addEventListener('click', () => {
                const date = activeDates.find(d => d.id === selectedDateId);
                if (date) {
                    dateInput.value = date.id;
                    titleInput.value = date.title;
                    costInput.value = date.cost;
                    methodInput.value = date.method;
                    
                    calcPeople.value = '';
                    calcRate.value = '';
                    
                    openModal(true);
                }
            });

            // Кнопка Шеринга (Отправить)
            document.getElementById('share-project-btn').addEventListener('click', async () => {
                const date = activeDates.find(d => d.id === selectedDateId);
                if (!date) return;
                
                const text = `📁 Проект: ${date.title}\n📅 Дата: ${date.full}\n💰 Смета: ${date.cost.toLocaleString('ru-RU')} ₽\n💵 Оплата: ${date.isPaid ? '✅ Оплачено' : '⏳ Ожидается'} (${date.method})`;
                
                if (navigator.share) {
                    try { await navigator.share({ title: 'Отчет по проекту', text: text }); } 
                    catch (err) { console.log('Ошибка шаринга', err); }
                } else {
                    navigator.clipboard.writeText(text);
                    alert('Текст отчета скопирован в буфер обмена!');
                }
            });

            // Парсинг Excel
            const uploadInput = document.getElementById('excel-upload');
            const dataContainer = document.getElementById('excel-data-container');
            const emptyState = document.getElementById('excel-empty-state');

            uploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    renderExcelData(json);
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            });

            function renderExcelData(data) {
                dataContainer.innerHTML = '';
                if (emptyState) emptyState.style.display = 'none';
                const headers = data[0];
                for (let i = 1; i < data.length; i++) {
                    const row = data[i];
                    if (!row || row.length === 0) continue;
                    let cardHtml = `<div class="bg-gray-900/60 backdrop-blur-md p-4 rounded-2xl border border-white/5 shadow-sm mb-3">`;
                    row.forEach((cell, index) => {
                        const headerName = headers[index] || `Колонка ${index + 1}`;
                        if (cell !== undefined && cell !== null && cell !== '') {
                            cardHtml += `<div class="mb-2 last:mb-0 flex justify-between gap-4 border-b border-white/5 pb-2 last:border-0 last:pb-0">
                                            <span class="text-xs text-gray-500 font-medium">${headerName}</span>
                                            <span class="text-sm text-gray-200 text-right">${cell}</span>
                                         </div>`;
                        }
                    });
                    cardHtml += `</div>`;
                    dataContainer.innerHTML += cardHtml;
                }
            }

            // Инициализация при старте
            renderTimeline();
            if (selectedDateId) updateContentArea();
            updateDashboard();
        });

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW', err)));
        }
    </script>
</body>
</html>
